<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 1. Borde de la ventana del avión (Forma de píldora) -->
  <rect x="106" y="56" width="300" height="400" rx="150" fill="#f4f1ea" stroke="#006d77" stroke-width="48"/>
  
  <!-- 2. Máscara para que el paisaje no se salga del vidrio -->
  <clipPath id="cristal-ventana">
    <rect x="106" y="56" width="300" height="400" rx="150" />
  </clipPath>
  
  <!-- 3. El Paisaje (Adentro de la ventana) -->
  <g clip-path="url(#cristal-ventana)">
    
    <!-- Sol atardecer -->
    <circle cx="256" cy="220" r="65" fill="#e67e22" />
    
    <!-- Montaña de fondo (Gris oscuro) -->
    <polygon points="60,456 210,240 400,456" fill="#333333" opacity="0.9"/>
    
    <!-- Montaña principal (Verde Esmeralda) -->
    <polygon points="160,456 340,270 512,456" fill="#006d77" />
    
  </g>
  
  <!-- 4. Reflejo del vidrio (Le da un efecto de cristal sutil) -->
  <path d="M 160 160 Q 256 60 350 160" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" opacity="0.7"/>
</svg>
